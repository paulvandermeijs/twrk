[package]
name = "twrk"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Open a project from your workspace in a tmux session with a configurable layout, optionally in a fresh git worktree."
license = "MIT"
repository = "https://github.com/paulvandermeijs/twrk"
readme = "README.md"
keywords = ["cli", "tmux", "git"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cliclack = "0.5"
console = "0.16"
dirs = "6"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
