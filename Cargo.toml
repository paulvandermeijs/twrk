[package]
name = "twrk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cliclack = "0.5"
console = "0.16"
dirs = "6"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
